name: mundo-encantado

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: mundo-encantado:latest
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: 3001
    ports:
      - "${APP_PORT:-3001}:3001"
    read_only: true
    tmpfs:
      - /tmp:size=64m
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3001/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
